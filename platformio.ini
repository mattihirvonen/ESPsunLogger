; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; https://docs.platformio.org/en/latest/boards/espressif32/esp32dev.html?utm_source=platformio&utm_medium=piohome

[platformio]
;default_envs = esp32dev
 default_envs = xiao_esp32s3
;src_dir = .

; https://docs.platformio.org/en/latest/projectconf/
[common]

; https://docs.platformio.org/en/latest/projectconf/sections/env/options/library/lib_deps.html

lib_deps_builtin =
    SPI
    Wire

lib_deps_mqtt =
    256dpi/MQTT@2.5.3
;   PubSubClient

lib_deps_server =
    https://github.com/BojanJurca/Lightweight-Standard-Template-Library-STL-for-Arduino
    https://github.com/BojanJurca/Multitasking-Http-Ftp-Telnet-Ntp-Smtp-Servers-and-clients-for-ESP32-Arduino-Library
    https://github.com/BojanJurca/Thread-safe-ping-Arduino-library-for-ESP32

lib_deps_ble =
    https://registry.platformio.org/libraries/avinabmalla/ESP32_BleSerial/installation
    avinabmalla/ESP32_BleSerial@^2.0.1
;   ; https://dashio.io/guide-arduino-esp32/
;   h2zero/NimBLE-Arduino
;   contrem/arduino-timer

;lib_ldf_mode = deep

;==========================================================================================================
; ESP32 DEVKIT V1 - DOIT / JoyIT
; https://randomnerdtutorials.com/esp32-pinout-reference-gpios/

[env:esp32dev]
 platform  = espressif32
;platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
 framework = arduino
 board     = esp32dev

;build_flags =
; -DCORE_DEBUG_LEVEL=5

;board_build.partitions = partitions_esp32dev_default.csv
;board_build.partitions = partitions_ESP32nodeMCU_pgm1M8.csv

lib_deps =
  ${common.lib_deps_builtin}
  ${common.lib_deps_server}
  ${common.lib_deps_mqtt}

; Custom Serial Monitor speed (baud rate)
monitor_speed = 115200

; Custom Serial Monitor port
;monitor_port = COM3

;==========================================================================================================
; XIAO ESP32S3 Seeed Studio
; https://wiki.seeedstudio.com/xiao_esp32s3_pin_multiplexing/

[env:xiao_esp32s3]
 platform  = espressif32
;platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
 framework = arduino
 board     = seeed_xiao_esp32s3

; https://docs.espressif.com/projects/esp-idf/en/latest/esp32s3/api-reference/kconfig.html#config-esp-console-uart
; https://docs.platformio.org/en/stable/projectconf/sections/env/options/build/build_flags.html
; https://espressif-docs.readthedocs-hosted.com/projects/arduino-esp32/en/latest/api/usb_cdc.html <<--!!

; Enable following when use board "seeed_xiao_esp32s3"
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
; -DCORE_DEBUG_LEVEL=5

board_build.partitions = partitions_ESP32S3_pgm2M.csv
;board_build.partitions = default_8MB.csv
;board_build.arduino.memory_type = qio_opi
;board_build.flash_size = 8MB

lib_deps =
  ${common.lib_deps_builtin}
  ${common.lib_deps_server}
  ${common.lib_deps_mqtt}

; Custom Serial Monitor speed (baud rate)
monitor_speed = 115200

; Custom Firmware Code Upload speed (baud rate)
;upload_speed = 115200

; Custom Serial Monitor port
;monitor_port = /dev/ttyUSB15
;monitor_port = COM4

; change microcontroller
;board_build.mcu = esp32

; change MCU frequency
;board_build.f_cpu = 240000000L

; board's default upload protocol is "esptool"
;upload_protocol = esptool
